<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8"><meta name="viewport" content="width=device=width, initial-scale=1">
        <title>The Missing Ember * A tiny Adventure</title>
        <style>
            :root{color-scheme:dark;--paper:#efe6ce;--muted:#a9b5a8;--gold:#edbf6b;--line:#38473f}*{box-sizing:border-box}body{margin:0;background:#111d19;color:var(--paper);font:16px/1.55 system-ui,sans-serif}main{max-width:1180px;margin:auto;padding:32px 24px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}.eyebrow{font-size:11px;letter-spacing:3px;color:var(--gold);text-transform:uppercase}h1{font:clamp(30px,5vw,52px)/1.1 Georgia,serif;margin:8px 0}p{margin:8px 0;color:var(--muted)}button{background:#273c32;border:1px solid #53674f;border-radius:7px;color:var(--paper);padding:10px 16px;font:600 14px system-ui;cursor:pointer}button:hover{background:#3d5541}button:focus-visible,canvas:focus-visible{outline:3px solid var(--gold);outline-offset:3px}button:disabled{opacity:.4;cursor:not-allowed}.primary{background:var(--gold);color:#201e14;border-color:var(--gold)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:22px}.world{background:#192c24;border:1px solid var(--line);border-radius:12px;overflow:hidden}.bar{padding:14px 18px;display:flex;justify-content:space-between;gap:12px;font-size:13px}.bar span:last-child{color:var(--gold)}canvas{display:block;width:100%;height:auto;image-rendering:pixelated;background:#263e30}.help{padding:14px 18px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}.panel{padding:20px;border:1px solid var(--line);border-radius:12px;background:#1a2922;margin-bottom:16px}h2{font:24px Georgia,serif;margin:0 0 12px}h3{font-size:12px;text-transform:uppercase;letter-spacing:2px;color:var(--gold);margin:0 0 12px}.stat{display:flex;justify-content:space-between;margin:10px 0}.track{height:8px;background:#101b15;border-radius:8px;overflow:hidden}.fill{height:100%;background:#89b77b;transition:width .2s}.steps{padding:0;list-style:none;font-size:14px}.steps li{padding:9px 0;border-bottom:1px solid var(--line);color:var(--muted)}.steps li.done{color:#acd393}.controls{display:flex;flex-wrap:wrap;gap:8px}.foot{margin-top:20px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:20px}.pad{display:grid;grid-template-columns:repeat(3,44px);gap:5px}.pad button{padding:8px}.mobile{display:flex;justify-content:space-between;padding:14px 18px;gap:15px;align-items:center}dialog{width:min(540px,calc(100% - 32px));border:1px solid #7c805b;border-radius:14px;padding:28px;background:#1c2c24;color:var(--paper);box-shadow:0 30px 100px #0009}dialog::backdrop{background:#07110cbb}dialog p{margin:14px 0 20px}.battle-art{font-size:60px;text-align:center;background:#122219;border-radius:8px;padding:12px;margin:16px 0}.log{min-height:70px;color:var(--paper);font-size:14px}.tag{font-size:11px;color:var(--gold);border:1px solid #776340;padding:6px 10px;border-radius:30px;white-space:nowrap}#notice{min-height:46px;font-size:13px;color:var(--gold)}@media(max-width:850px){.layout{grid-template-columns:1fr}aside{display:grid;grid-template-columns:1fr 1fr;gap:14px}.panel{margin:0}header{align-items:flex-start}.tag{display:none}}@media(max-width:520px){main{padding:20px 12px}aside{grid-template-columns:1fr}.foot{flex-direction:column}header{margin-bottom:18px}}
        </style>
    </head>
    <body><main>
        <header><div><div class="eyebrow">A tiny Adventure * Chapter one</div><h1>The Missing Ember</h1><p> A quiet village. A fading light. One small act of courage.</p></div>div><span class="tag">MODULE 02 / PLAYABLE PROTOTYPE</span></header>
    </main></body>
</html>
